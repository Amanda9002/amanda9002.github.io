name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A0671C: ${{ secrets.A0671C }}
          BB4D34: ${{ secrets.BB4D34 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A0671C', '')
          meta_b = os.environ.get('BB4D34', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- fc880521e0478de395f4b647 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- d1435a18bb143a857ad63d7125376a785f -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
